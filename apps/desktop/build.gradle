plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.swing']
}

// JavaFX natives are published per platform; pick the classifier matching the
// machine running the build so the fat jar works on both Intel and Apple Silicon.
def javafxPlatform = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def aarch64 = arch in ['aarch64', 'arm64']
    if (os.contains('mac')) return aarch64 ? 'mac-aarch64' : 'mac'
    if (os.contains('win')) return 'win'
    return aarch64 ? 'linux-aarch64' : 'linux'
}()

dependencies {
    implementation 'org.json:json:20240303'
    implementation "org.openjfx:javafx-controls:21.0.2:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:21.0.2:${javafxPlatform}"
    implementation "org.openjfx:javafx-base:21.0.2:${javafxPlatform}"
    implementation "org.openjfx:javafx-swing:21.0.2:${javafxPlatform}"
}

application {
    mainClass = 'com.example.todoapp.Launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

run {
    systemProperties System.getProperties()
    jvmArgs = ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}

shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
}
