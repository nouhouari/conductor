name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root + workspaces)
        run: npm ci

      # ── conductor-e2e (framework) ─────────────────────────────────────────

      - name: Type-check & build (conductor-e2e)
        run: npm run build

      - name: Verify package contents (conductor-e2e)
        run: npm pack --dry-run

      - name: Dry-run example scenarios
        working-directory: example
        run: |
          npx cucumber-js --dry-run \
            --require-module ts-node/register \
            --require-module tsconfig-paths/register \
            --require '../src/hooks/index.ts' \
            --require 'step-definitions/**/*.ts' \
            --format summary \
            features/api/todo-api.feature \
            features/web/todo-crud.feature \
            features/desktop/todo-desktop.feature \
            features/cross-platform/web-to-mobile-sync.feature

      # ── conductor-mcp ────────────────────────────────────────────────────

      # Typecheck (`npm run typecheck -w mcp`) is intentionally OMITTED in CI.
      # The @modelcontextprotocol/sdk types.d.ts (~8200 lines of deep conditional
      # generics on registerTool/setRequestHandler) makes `tsc --noEmit` peak
      # above 6 GB, which OOMs even with --max-old-space-size=6144 on GitHub's
      # 7 GB hosted runners. esbuild already validates that the code parses
      # and resolves; the smoke tests below validate runtime behavior.
      # Devs can still run `npm run typecheck -w mcp` locally (recommend
      # NODE_OPTIONS=--max-old-space-size=8192 or higher).

      - name: Build (conductor-mcp)
        run: npm run build -w mcp

      - name: Verify package contents (conductor-mcp)
        run: npm pack --dry-run -w mcp

      - name: Smoke test (conductor-mcp)
        run: cd mcp && npm run test:smoke

      # ── drift check ──────────────────────────────────────────────────────
      # Verifies that the hooks path resolution used by init_project's cucumber.js
      # template still works.  The template resolves conductor-e2e's main entry
      # and derives the hooks path via .replace() — if the framework ever renames
      # or moves dist/src/hooks/index.js this step will fail loudly.

      - name: Drift check — @nouhouari/conductor-e2e hooks path
        run: |
          node - <<'EOF'
          const path = require('path');
          let conductorMain;
          try {
            conductorMain = require.resolve('@nouhouari/conductor-e2e');
          } catch (e) {
            // In CI the package is not published yet; resolve from the local build
            // artefact (dist/ is present after the build step above).
            conductorMain = require.resolve('./dist/src/index.js');
          }
          const hooksPath = conductorMain.replace(
            /[/\\]dist[/\\]src[/\\]index\.js$/,
            path.sep + path.join('dist', 'src', 'hooks', 'index.js')
          );
          const fs = require('fs');
          if (!fs.existsSync(hooksPath)) {
            console.error('hooks path does not exist:', hooksPath);
            console.error('conductor-e2e main was:', conductorMain);
            process.exit(1);
          }
          console.log('hooks resolved:', hooksPath);
          EOF

  # ── conductor-java ─────────────────────────────────────────────────────
  # Independent of the Node job: the Java port shares the Gherkin feature
  # files under example/features but has its own Maven reactor under java/.
  java:
    name: Build & validate (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # toolchain JDK; sources compile to release 17
          cache: 'maven'

      # conductor-core is the publishable library — it must build and pass its
      # unit tests (ConfigLoaderTest) headlessly on every push. `install` (not
      # `verify`) so the conductor-example steps below can resolve it from the
      # local repository.
      - name: Build & test (conductor-core)
        working-directory: java
        run: mvn -B -ntp -pl conductor-core -am install

      # conductor-example's suites drive real browsers / JavaFX / a Postgres
      # server, so they cannot run on a hosted runner. Compiling the step
      # definitions and page objects still catches API drift in conductor-core.
      - name: Compile step definitions & page objects (conductor-example)
        working-directory: java
        run: mvn -B -ntp -pl conductor-example -am test-compile

      # Java counterpart of "Dry-run example scenarios" above: resolves every
      # Gherkin step in example/features against the Java glue without
      # launching a browser or device. Fails on undefined/ambiguous steps.
      #
      # The Cucumber CLI is used rather than `mvn test` because the JUnit
      # Platform @Suite classes pin features/glue/plugin via
      # @ConfigurationParameter, which takes precedence over -D properties.
      - name: Dry-run example scenarios (Java glue)
        working-directory: java
        run: |
          mvn -B -ntp -q -pl conductor-example \
            dependency:build-classpath \
            -Dmdep.outputFile=target/test-classpath.txt \
            -Dmdep.includeScope=test
          cd conductor-example
          java -cp "target/classes:target/test-classes:$(cat target/test-classpath.txt)" \
            io.cucumber.core.cli.Main \
            --dry-run \
            --glue com.nouhouari.conductor.hooks \
            --glue com.nouhouari.conductor.example.stepdefs \
            --plugin summary \
            ../../example/features
