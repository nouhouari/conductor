name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, GitHub Release, GitHub Packages & npm publish (conductor-e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Pack tarball
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nouhouari-conductor-e2e-*.tgz

      - name: Publish to GitHub Packages
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on GitHub Packages, skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Second registry: public npmjs.org. setup-node rewrites .npmrc so the
      # @nouhouari scope and NODE_AUTH_TOKEN below point at registry.npmjs.org. The explicit
      # --registry flag overrides the publishConfig in package.json, which
      # points at GitHub Packages. NPM_TOKEN must be a repository secret holding
      # an npmjs.org automation/granular token with publish rights on the
      # @nouhouari scope.
      - name: Set up Node.js (npmjs.org)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # Must be explicit: the GitHub Packages setup-node step above wrote
          # `@nouhouari:registry=https://npm.pkg.github.com/` (scope defaults to
          # the repo owner), and a scoped registry beats `--registry`. Setting
          # the scope here replaces that line so publishes really hit npmjs.org.
          scope: '@nouhouari'

      - name: Publish to npmjs.org
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN repository secret is not set"
            exit 1
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npmjs.org, skipping"
          else
            npm publish --registry https://registry.npmjs.org --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
