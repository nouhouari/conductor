name: Release conductor-java

# Triggers on tags of the form java-v<semver>, e.g. java-v0.1.0.
# Companion workflows: release.yml (v* → conductor-e2e npm package) and
# release-mcp.yml (mcp-v* → conductor-mcp npm package).
on:
  push:
    tags:
      - 'java-v*'

jobs:
  release-java:
    name: Build, GitHub Release & Maven Central publish (conductor-java)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release + upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # toolchain JDK; sources compile to release 17
          cache: 'maven'
          # Writes a ~/.m2/settings.xml with a <server> whose id is `central`,
          # matching <publishingServerId> in java/pom.xml's release profile,
          # and imports the signing key for maven-gpg-plugin.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Verify the pushed tag version matches java/pom.xml, and refuse to
      # release a SNAPSHOT. e.g. tag java-v0.1.0 requires <version>0.1.0.
      - name: Verify version matches tag
        working-directory: java
        run: |
          POM_VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG_VERSION="${GITHUB_REF#refs/tags/java-v}"
          echo "pom=$POM_VERSION tag=$TAG_VERSION"
          case "$POM_VERSION" in
            *-SNAPSHOT)
              echo "::error::Refusing to release SNAPSHOT version $POM_VERSION. Set a release version in java/pom.xml first (mvn versions:set -DnewVersion=$TAG_VERSION)."
              exit 1
              ;;
          esac
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag java-v$TAG_VERSION does not match java/pom.xml version $POM_VERSION"
            exit 1
          fi

      # conductor-example's suites need real browsers / devices, so only
      # conductor-core (the publishable library) is built and tested here.
      - name: Build & test (conductor-core)
        working-directory: java
        run: mvn -B -ntp -pl conductor-core -am verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            java/conductor-core/target/conductor-core-*.jar

      # Signs and uploads the parent POM + conductor-core (with sources and
      # javadoc jars) to the Sonatype Central Portal, then waits until the
      # deployment is published. conductor-example is not in the reactor.
      # MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD are a Central Portal
      # user token (central.sonatype.com → View Account → Generate User Token).
      - name: Publish to Maven Central
        working-directory: java
        run: |
          for s in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!s}" ]; then
              echo "::error::$s repository secret is not set"
              exit 1
            fi
          done
          mvn -B -ntp -P release -pl conductor-core -am deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
