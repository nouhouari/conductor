# Overlay applied on top of default.yml (+ local-overrides.yml) when
# TEST_ENV=dev. Only overrides name/web/api, matching config/environments/dev.ts.
name: dev
web:
  baseUrl: http://localhost:3000
  headless: false
  browserName: chromium
  slowMo: 100
api:
  baseUrl: http://localhost:3000/api
  defaultCredentials:
    username: dev@example.com
    password: devpassword
  timeoutMs: 60000
