# Overlay applied on top of default.yml (+ local-overrides.yml) when
# TEST_ENV=staging. Matches config/environments/staging.ts.
name: staging
web:
  baseUrl: https://staging.example.com
  headless: true
  browserName: chromium
api:
  baseUrl: https://staging.example.com/api
  defaultCredentials:
    username: staging@example.com
    password: stagingpassword
  timeoutMs: 45000
